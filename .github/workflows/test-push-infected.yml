# Pushes an image with EICAR to :eicar-test, skipping the scan.
# Used to test the weekly rescan. Not needed in other repos.
name: "Test: push infected image"

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - env:
          EICAR_B64: WDVPIVAlQEFQWzRcUFpYNTQoUF4pN0NDKTd9JEVJQ0FSLVNUQU5EQVJELUFOVElWSVJVUy1URVNULUZJTEUhJEgrSCo=
        run: |
          mkdir ctx && echo "$EICAR_B64" | base64 -d > ctx/eicar.com
          repo="${GITHUB_REPOSITORY,,}"
          printf 'FROM ghcr.io/%s:main\nCOPY eicar.com /src/app/\n' "$repo" | docker build -t "ghcr.io/$repo:eicar-test" -f - ctx
          docker push "ghcr.io/$repo:eicar-test"
