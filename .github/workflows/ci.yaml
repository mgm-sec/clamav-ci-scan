# Reference pipeline. Copy the parts marked CLAMAV into your own ci.yaml.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  # CLAMAV: scan the repository on every PR and push
  malware_scan:
    name: Scan repository for malware (ClamAV)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan repository for malware (ClamAV)
        run: tar -cf - --exclude=./.git . | bash .github/clamav-scan.sh

  image_build_scan_push:
    name: Build, scan, and push Docker image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # CLAMAV: scan the image before it is pushed
      - name: Scan image for malware (ClamAV)
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: docker export "$(docker create "$IMAGE")" | bash .github/clamav-scan.sh

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ steps.meta.outputs.tags }}" | xargs -I{} docker push {}
